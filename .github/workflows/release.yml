name: Release

# Publishes to PyPI when a v* tag is pushed. Authentication uses PyPI Trusted
# Publishing (OIDC), so no API token is stored in this repository. Configure the
# publisher once at https://pypi.org/manage/project/pfcuda/settings/publishing/
# with owner Mou1z, repository PfCUDA, workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, pathlib, tomllib

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text()
          )["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")

          if tag != version:
              raise SystemExit(
                  f"tag {tag!r} does not match pyproject version {version!r}"
              )
          print(f"tag and version agree: {version}")
          PY

      # Packaging the sources needs no CUDA toolkit; the compile happens on the
      # installing machine.
      - name: Build
        run: |
          python -m pip install --quiet --upgrade pip build twine
          python -m build --sdist
          python -m twine check dist/*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pfcuda
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
